# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
displayName: pi factory
description: Herdr session with pi, Fresh, Hunk, and an in-sandbox Docker daemon on Node 24

provides:
  - "node@24"
  - "pi-factory@1"

args:
  pi_version:
    default: latest
    pattern: '^(latest|[0-9]+\.[0-9]+\.[0-9]+)$'
    description: npm dist-tag or version of @earendil-works/pi-coding-agent
    buildArg: PI_VERSION
  hunk_version:
    default: "0.24.1"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: modem-dev/hunk release that provides the hunk binary
    buildArg: HUNK_VERSION
  factory_version:
    default: "0.1.0"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: geut/factory-skills release that provides the factory binary
    buildArg: FACTORY_VERSION

capabilities:
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/long-running@1
  - type: com.docker.sandbox/port@1
    config:
      name: factory-api
      container: 7731
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - registry.npmjs.org
          - github.com
          - api.github.com
          - cli.github.com
          - codeload.github.com
          - raw.githubusercontent.com
          - objects.githubusercontent.com
          - release-assets.githubusercontent.com
          - opencode.ai
          - api.socket.dev
          - firewall-api.socket.dev
          - herdr.dev
  - type: com.docker.sandbox/agent-context@1
    config:
      filename: AGENTS.md
      contentFile: ./context.md
