# System-wide uv settings from the python mixin (a mixin cannot set ENV).
# A project's pyproject.toml or uv.toml still overrides these.

# The uv cache lives under $HOME (~/.cache/uv), but worktrees live on the
# workspace, a host mount: hard links between the two cross filesystems, and
# uv would fall back to copying with a warning on every sync. Copying from the
# cache is what happens anyway, so say so: a second worktree's sync still
# downloads nothing.
link-mode = "copy"
