# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: python for the pi factory
description: uv through Socket Firewall, a uv-managed CPython, and build tools for the factory sandbox
sourceUrl: https://github.com/geut/sbx-shell-pi

args:
  uv_version:
    default: "0.13.8"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: astral-sh/uv release, checked against its .sha256
    buildArg: UV_VERSION

provides:
  - "io.github.geut/python@1"
requires:
  - "io.github.geut/pi-factory >= 1"

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      # apt-get update refreshes every configured source, so the factory's
      # Docker and GitHub CLI repositories are listed too. Ubuntu serves amd64
      # from archive/security and arm64 from ports.
      install:
        allow:
          - archive.ubuntu.com
          - security.ubuntu.com
          - ports.ubuntu.com
          - download.docker.com
          - cli.github.com
      runtime:
        allow:
          # PyPI, through Socket Firewall (whose hosts the factory allows)
          - pypi.org
          - files.pythonhosted.org
          # uv-managed CPython (python-build-standalone, Astral's mirror)
          - releases.astral.sh
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: |
            set -eu
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential pkg-config
            rm -rf /var/lib/apt/lists/*
          user: "0"
          description: Install the C toolchain and pkg-config
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./context.md
